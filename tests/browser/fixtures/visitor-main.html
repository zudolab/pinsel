<!-- Synthetic <main> for tests/browser/visitor-scripts.spec.ts: the prototype's
     art window, archive TOC rail (faq page) and contact form markup, placed
     inside the built home page frame until the real routes exist. -->
<div class="art-window art-window--large" aria-hidden="true" data-parallax data-drift="1" data-motion-range="52">
  <svg aria-hidden="true" focusable="false" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
    <g data-depth="-0.5" data-layer="back"><rect width="1200" height="700" data-pigment="back" fill="var(--art-back, #B8C4B6)" /></g>
    <g data-depth="0.35" data-layer="mid"><rect y="200" width="1200" height="500" data-pigment="wash" fill="var(--art-wash, #9EBFBB)" /></g>
    <g data-depth="0.85" data-layer="front"><rect y="450" width="1200" height="250" data-pigment="current" fill="var(--art-current, #60767D)" /></g>
  </svg>
</div>
<div class="container archive-layout">
  <aside>
    <nav class="page-toc" aria-label="質問のカテゴリー">
      <p class="eyebrow"><span>質問のカテゴリー</span></p>
      <ol>
        <li><a href="#faq-1"><span aria-hidden="true">01</span>受験について</a></li>
        <li><a href="#faq-2"><span aria-hidden="true">02</span>レッスンについて</a></li>
        <li><a href="#faq-3"><span aria-hidden="true">03</span>ドイツ語について</a></li>
        <li><a href="#faq-4"><span aria-hidden="true">04</span>費用・申し込みについて</a></li>
      </ol>
    </nav>
  </aside>
  <div class="archive-body">
    <section class="faq-category reading-zone" id="faq-1" style="min-block-size: 1100px"><h2>受験について</h2><div class="faq-list"><details id="q-1"><summary>Q1</summary><div class="faq-list__answer"><p style="block-size: 600px">A1</p></div></details></div></section>
    <section class="faq-category reading-zone" id="faq-2" style="min-block-size: 1100px"><h2>レッスンについて</h2></section>
    <section class="faq-category reading-zone" id="faq-3" style="min-block-size: 1100px"><h2>ドイツ語について</h2></section>
    <section class="faq-category reading-zone" id="faq-4" style="min-block-size: 1100px"><h2>費用・申し込みについて</h2></section>
  </div>
</div>
<div class="container contact-layout">
  <div class="contact-panel">
    <form id="contact-form" class="contact-form" novalidate aria-label="お問い合わせフォーム">
      <p class="form-error" role="alert" data-form-error hidden>送信に失敗しました。時間をおいて再度お試しください。</p>
      <div class="form-field"><label for="name">お名前<span>必須</span></label><input id="name" name="name" type="text" autocomplete="name" required><p class="form-error" id="name-error" hidden></p></div>
      <div class="form-field"><label for="email">メールアドレス<span>必須</span></label><input id="email" name="email" type="email" autocomplete="email" required><p class="form-error" id="email-error" hidden></p></div>
      <div class="form-field"><label for="course">ご希望のコース<span>任意</span></label><select id="course" name="course"><option value="未定">未定</option><option value="有料進路相談">有料進路相談</option><option value="2ヶ月コース">2ヶ月コース</option><option value="4ヶ月コース">4ヶ月コース</option></select><p class="form-error" id="course-error" hidden></p></div>
      <div class="form-field"><label for="message">ご相談内容<span>必須</span></label><textarea id="message" name="message" rows="6" required></textarea><p class="form-error" id="message-error" hidden></p></div>
      <button type="submit" class="button button--primary"><span class="button__label"><span data-submit-label>送信する</span></span></button>
    </form>
    <div class="form-success" tabindex="-1" hidden><h2>送信ありがとうございます</h2><button type="button" class="button" data-form-back>入力画面に戻る</button></div>
  </div>
</div>
